version: '3.8'

services:
  iss_tracker:
    build: .
    ports:
      - "5000:5000" 
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - DATA_DIR=/data

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379" 
    volumes:
      - ./data:/data  

  test:
    build:
      context: .
    command: pytest
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379 
